# P1 — full 28-class BIOS occupation prediction, gender disallowed.
# Used by scripts/run_pcrl_bios_layer12.py and scripts/run_baselines_layer12.py.
purpose: P1
task: occupation_28
disallowed_attribute: gender
num_classes: 28

# Alphabetic order matches LabHC/bias_in_bios.profession (int label index ↔ name).
# Source: De-Arteaga et al. NAACL 2019 "Bias in Bios". Hard-coded here because
# the HF release ships profession as a bare int64 with no label_names attribute
# (matches pcrl/language/bios_dataset.py:25).
labels:
  - accountant
  - architect
  - attorney
  - chiropractor
  - comedian
  - composer
  - dentist
  - dietitian
  - dj
  - filmmaker
  - interior_designer
  - journalist
  - model
  - nurse
  - painter
  - paralegal
  - pastor
  - personal_trainer
  - photographer
  - physician
  - poet
  - professor
  - psychologist
  - rapper
  - software_engineer
  - surgeon
  - teacher
  - yoga_teacher
