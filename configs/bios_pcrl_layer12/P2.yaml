# P2 — 5-class supercategory of BIOS occupations, gender disallowed.
# Coarse grouping per spec; covers all 28 BIOS occupations.
purpose: P2
task: supercategory_5
disallowed_attribute: gender
num_classes: 5

supercategories:
  medical:
    - physician
    - surgeon
    - dentist
    - psychologist
    - nurse
    - chiropractor
    - dietitian
  STEM:
    - software_engineer
    - composer  # composer treated as STEM-adjacent (closest to programmer/architect axis)
    - professor
    - accountant
  law_policy:
    - attorney
    - paralegal
  arts_media:
    - journalist
    - photographer
    - painter
    - poet
    - filmmaker
    - dj
    - comedian
    - model
  services:
    - teacher
    - personal_trainer
    - yoga_teacher
    - interior_designer
    - architect
    - pastor
    - rapper

# Index mapping for the cached supercategory label tensor:
# 0 = medical, 1 = STEM, 2 = law_policy, 3 = arts_media, 4 = services
class_index_order:
  - medical
  - STEM
  - law_policy
  - arts_media
  - services
