# Example configuration for PCRL on the Adult/Census dataset
experiment_name: adult_pcrl_experiment
data_dir: data
output_dir: outputs/adult

model:
  input_dim: 108  # Number of features after preprocessing
  hidden_dims: [256, 128]
  repr_dim: 64
  purpose_emb_dim: 32
  conditioning: film  # Options: film, concat, attention

  purposes:
    - name: income_prediction
      allowed_tasks:
        - income
      disallowed_attrs:
        - sex
        - race
      task_type: classification

    - name: income_prediction_age_fair
      allowed_tasks:
        - income
      disallowed_attrs:
        - sex
        - race
        - age
      task_type: classification

training:
  batch_size: 256
  lr_encoder: 0.001
  lr_auditor: 0.001
  lambda_adv: 1.0
  auditor_steps: 5
  epochs: 100
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 10
  checkpoint_dir: checkpoints/adult
  log_interval: 50
  eval_interval: 200
  seed: 42
